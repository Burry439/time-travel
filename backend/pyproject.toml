[project]
name = "time-travel-m0"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=3.26,<4",
    "python-dotenv>=1,<2",
    "truststore>=0.9",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "gdtoolkit>=4,<5",
    "pillow>=10,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
# E501: the formatter keeps code to 120; long prose strings are fine. B905: zip() lengths are checked where it matters.
ignore = ["E501", "E731", "B905", "SIM102", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # pytest fixtures imported from other test modules are used by name
